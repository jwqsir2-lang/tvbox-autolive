name: 自动更新直播配置

on:
  schedule:
    # 每 6 小时构建一次（直播源的 wsTime 防盗链时间戳约每 6h 刷新一次）
    - cron: '0 */6 * * *'
  workflow_dispatch:   # 也能在 Actions 页面手动点「Run workflow」立即更新
  push:
    branches: [main]
    paths:
      - 'base.json'
      - 'build.py'

permissions:
  contents: write   # 允许 workflow 把生成的新配置提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成直播配置
        run: python build.py --base base.json --out tvbox.json --no-probe

      - name: 提交更新后的配置
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox.json
          git commit -m "auto: 更新直播配置 $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git push

      - name: 上传配置到 serv00 网站空间
        env:
          SERV00_HOST:     ${{ secrets.SERV00_HOST }}
          SERV00_USER:     ${{ secrets.SERV00_USER }}
          SERV00_PASS:     ${{ secrets.SERV00_PASS }}
          SERV00_WEBDIR:   ${{ secrets.SERV00_WEBDIR }}
        run: |
          if [ -z "$SERV00_HOST" ]; then
            echo "还没配置 serv00 密钥，跳过上传（仓库里的 tvbox.json 仍是最新的）"
            exit 0
          fi
          pip install pyftpcloudfs --quiet 2>/dev/null || true
          python - <<'PY'
          import os, sys, ftplib, posixpath
          host  = os.environ["SERV00_HOST"]
          user  = os.environ["SERV00_USER"]
          pwd   = os.environ["SERV00_PASS"]
          webdir= os.environ.get("SERV00_WEBDIR", "public_html")
          ftp = ftplib.FTP(host, timeout=30)
          ftp.login(user, pwd)
          try:
              ftp.cwd(webdir)
          except Exception:
              for part in webdir.split("/"):
                  if part:
                      try: ftp.cwd(part)
                      except Exception: ftp.mkd(part); ftp.cwd(part)
          with open("tvbox.json", "rb") as f:
              ftp.storbinary("STOR tvbox.json", f)
          print("已上传:", ftp.pwd() + "/tvbox.json")
          ftp.quit()
          PY
